name: VideoFinal CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -U pip
      - run: python -m pip install numpy Pillow opencv-python-headless requests
      - run: python -m py_compile videofinal.py
      - run: python videofinal.py --selftest
